name: Make GHCR Public

on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - name: Set package visibility to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER}"
          pkg="grok2api"
          # User-owned package visibility API
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/${pkg}/visibility" \
            -d '{"visibility":"public"}' || true)
          echo "user API HTTP $code"
          cat /tmp/out.json || true
          echo
          # Fallback: users/:username path
          code2=$(curl -sS -o /tmp/out2.json -w "%{http_code}" \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/${owner}/packages/container/${pkg}/visibility" \
            -d '{"visibility":"public"}' || true)
          echo "users API HTTP $code2"
          cat /tmp/out2.json || true
          echo
          # Verify anonymous pull token
          token=$(curl -sS "https://ghcr.io/token?service=ghcr.io&scope=repository:${owner,,}/${pkg}:pull" | jq -r .token)
          manifest_code=$(curl -sS -o /tmp/manifest.json -w "%{http_code}" \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${owner,,}/${pkg}/manifests/latest")
          echo "anonymous manifest HTTP $manifest_code"
          head -c 400 /tmp/manifest.json || true
          echo
          if [ "$manifest_code" != "200" ]; then
            echo "Package still not anonymously pullable"
            exit 1
          fi
